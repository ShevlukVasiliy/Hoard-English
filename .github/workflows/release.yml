# Десктопные сборки Tauri по тегу v*: macOS (Apple Silicon и Intel), Windows, Linux.
# Установщики попадают в черновик релиза — опубликовать его вручную.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hoard ${{ github.ref_name }}
          releaseBody: See the table below to pick your file.
          releaseDraft: true
          prerelease: false
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

  # Понятные имена файлов (macOS Apple Silicon / Intel …) и таблица «какой файл скачать»
  assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Переименовать установщики
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-assets.sh "${{ github.ref_name }}"
      - name: Добавить таблицу в описание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > body.md
          echo >> body.md
          sed "s/VERSION/$v/g" .github/release-download.md >> body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file body.md
